org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler tries to relativize paths between the pub
# cache (C:) and this project (D:), which throws on Windows when the two
# roots are on different drives ("this and base files have different
# roots"). Disabling incremental compilation avoids that codepath entirely
# — a documented workaround for this exact cross-drive scenario, not a
# general performance tradeoff we'd otherwise choose.
kotlin.incremental=false
